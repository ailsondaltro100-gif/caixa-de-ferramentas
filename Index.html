<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caixa de ferramentas IA</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0a0a1a;--card:#14142b;--card2:#1c1c3a;--line:#2e2e55;--txt:#f3f2fa;--mut:#a3a1c2;--acc:#7c4ddb;--acc2:#a78bfa;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f4ff;--card:#fff;--card2:#efeafe;--line:#d9d2f3;--txt:#1b1633;--mut:#5d5782;--acc:#6d3fd1;--acc2:#6d3fd1;--ok:#15803d;--bad:#b91c1c;color-scheme:light}}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#241a52 0,var(--bg) 55%) no-repeat,var(--bg);color:var(--txt);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) body{background:var(--bg)}}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 56px}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:-.02em}.logo i{color:var(--acc2);font-style:normal}
.badge{border:1px solid var(--line);border-radius:999px;padding:8px 16px;color:var(--acc2);font-size:.85rem}
.hero{text-align:center;padding:48px 0 28px}
.hero h1{font-size:clamp(2rem,7vw,4rem);line-height:1.05;letter-spacing:-.03em;margin:0 0 14px}
.hero h1 span{color:var(--acc2)}
.hero p{color:var(--mut);max-width:520px;margin:0 auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}
.chip{background:transparent;border:1px solid var(--line);color:var(--mut);padding:9px 16px;border-radius:999px;font:inherit;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.tc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;cursor:pointer;text-align:left;color:inherit;font:inherit;display:flex;flex-direction:column;gap:6px}
.tc:hover,.tc:focus-visible{border-color:var(--acc2);background:var(--card2);outline:0}
.tc .ic{font-size:1.8rem}.tc small{color:var(--acc2)}.tc b{font-size:1.1rem}.tc span{color:var(--mut);font-size:.92rem}
.back{background:none;border:1px solid var(--line);color:var(--acc2);padding:10px 16px;border-radius:999px;font:inherit;cursor:pointer;margin:22px 0 18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(16px,3vw,28px);max-width:760px;margin:0 auto}
#tool h2{font-size:clamp(1.6rem,5vw,2.3rem);margin:0 0 4px;letter-spacing:-.02em;text-align:center}
#tool>p{color:var(--mut);text-align:center;margin:0 0 20px}
label{display:flex;flex-direction:column;gap:6px;color:var(--mut);font-size:.9rem;margin-bottom:12px;min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--txt);font:inherit;font-size:1.05rem;padding:12px 14px;width:100%}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) input,:root:not([data-theme="dark"]) select,:root:not([data-theme="dark"]) textarea{background:#fff}}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc2);box-shadow:0 0 0 3px rgba(167,139,250,.25)}
input[type=range]{padding:0;accent-color:var(--acc)}input[type=checkbox]{width:auto;accent-color:var(--acc)}input[type=file]{font-size:.95rem}
textarea{min-height:160px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
.chk{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:12px}.chk label{flex-direction:row;align-items:center;gap:8px;margin:0;color:var(--txt)}
button.p,button.s{border-radius:12px;padding:12px 22px;font:inherit;cursor:pointer;border:1px solid var(--acc);margin:4px 8px 4px 0}
button.p{background:var(--acc);color:#fff}button.s{background:var(--card2);color:var(--txt);border-color:var(--line)}
.big{background:linear-gradient(135deg,#2a1c5c,#1c1c3a);border:1px solid var(--acc);border-radius:16px;padding:18px 20px;margin:14px 0;color:#f3f2fa}
.big small{color:#c4b5fd;display:block}.big strong{font-size:clamp(1.9rem,7vw,2.8rem);letter-spacing:-.02em;line-height:1.15}
.steps{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.steps h3{margin:0 0 4px;font-size:1rem}.steps p{margin:0 0 10px;color:var(--mut);font-size:.9rem}
.steps ol{margin:0;padding:0;list-style:none;counter-reset:n;display:grid;gap:12px}
.steps li{counter-increment:n;display:grid;grid-template-columns:28px 1fr;gap:2px 12px}
.steps li:before{content:counter(n);grid-row:span 2;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:.85rem;font-weight:700}
code{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--acc2);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;overflow-wrap:anywhere;display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.stats div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}.stats b{display:block;font-size:1.6rem}.stats span{color:var(--mut);font-size:.85rem}
.msg{color:var(--mut);border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center;margin-top:12px}
.up{color:var(--ok)}.down{color:var(--bad)}
.tab{width:100%;overflow-x:auto}
.img{max-width:100%;height:auto;border-radius:12px;display:block;margin:10px auto;background:#fff}
.paper{background:#fff;color:#111;border-radius:6px;padding:22px;margin-top:14px;font-size:.95rem;overflow-x:auto}
.paper h4{margin:0;font-size:1.5rem}.paper h5{margin:14px 0 4px;font-size:.95rem;border-bottom:2px solid #7c4ddb;color:#4b2bb0;padding-bottom:2px}
.paper p{margin:2px 0;white-space:pre-wrap}.paper table{width:100%;border-collapse:collapse;margin-top:8px}.paper td,.paper th{border-bottom:1px solid #ddd;padding:6px 4px;text-align:left}.paper .r{text-align:right}
.irow{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:8px}
.irow input{padding:10px}
@media (max-width:560px){.irow{grid-template-columns:1fr 1fr}.irow input:first-child{grid-column:1/3}}
@media print{body *{visibility:hidden}.paper,.paper *{visibility:visible}.paper{position:absolute;left:0;top:0;width:100%;margin:0}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<nav><div class="logo">✦ Caixa de ferramentas <i>IA</i></div><div class="badge">100% gratuito para começar</div></nav>

<main id="home">
 <section class="hero"><h1>Tudo o que você precisa.<br><span>Em um só lugar.</span></h1>
 <p>Ferramentas simples e inteligentes para facilitar seu dia a dia. Rápido, prático e acessível.</p></section>
 <div class="chips" id="chips"></div>
 <div class="grid" id="grid"></div>
</main>

<section id="tool" hidden>
 <button class="back" id="back">← Voltar para ferramentas</button>
 <h2 id="tt"></h2><p id="td"></p>
 <div class="panel" id="tb"></div>
</section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const nf=(n,d=2)=>n.toLocaleString('pt-BR',{maximumFractionDigits:d});
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pn=s=>{s=String(s).trim();if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return Number(s)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const result=(big,leg,formula,steps)=>`<div class="big"><small>${leg}</small><strong>${big}</strong></div>
<div class="steps"><h3>Como chegamos nesse resultado</h3><p>Fórmula: ${formula}</p><ol>${steps.map(s=>`<li><span>${s[0]}</span><code>${s[1]}</code></li>`).join('')}</ol></div>`;
const print=()=>{try{window.print()}catch(e){alert('Use o menu do navegador para imprimir ou salvar como PDF.')}};

/* 1. Porcentagem */
function pctTool(r){
 const M={of:['Porcentagem de um valor','Valor','Porcentagem (%)','200','15'],is:['Quantos % um valor é de outro','Valor parcial','Valor total','30','120'],desc:['Desconto','Preço original (R$)','Desconto (%)','250','20'],acr:['Acréscimo','Valor original (R$)','Acréscimo (%)','1000','10'],var:['Variação percentual','Valor inicial','Valor final','80','100']};
 r.innerHTML=`<label>Tipo de cálculo<select id="m">${Object.entries(M).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select></label>
 <div class="row"><label><span id="la"></span><input id="a" inputmode="decimal" autocomplete="off"></label><label><span id="lb"></span><input id="b" inputmode="decimal" autocomplete="off"></label></div><div id="o"></div>`;
 const m=$('#m',r),a=$('#a',r),b=$('#b',r),o=$('#o',r);
 const calc=()=>{const k=m.value,v=M[k];$('#la',r).textContent=v[1];$('#lb',r).textContent=v[2];a.placeholder='Ex.: '+v[3];b.placeholder='Ex.: '+v[4];
  const x=pn(a.value),y=pn(b.value);if(isNaN(x)||isNaN(y)){o.innerHTML='<div class="msg">Preencha os dois campos para ver o resultado e o passo a passo.</div>';return}
  if(k=='of'){const d=y/100,t=x*d;o.innerHTML=result(nf(t),`${nf(y)}% de ${nf(x)}`,'valor × (porcentagem ÷ 100)',[['Transforme a porcentagem em decimal',`${nf(y)} ÷ 100 = ${nf(d,4)}`],['Multiplique pelo valor',`${nf(x)} × ${nf(d,4)} = ${nf(t)}`]])}
  if(k=='is'){if(!y){o.innerHTML='<div class="msg">O valor total não pode ser zero.</div>';return}const d=x/y,t=d*100;o.innerHTML=result(nf(t)+'%',`${nf(x)} é quantos % de ${nf(y)}`,'(parcial ÷ total) × 100',[['Divida o parcial pelo total',`${nf(x)} ÷ ${nf(y)} = ${nf(d,4)}`],['Multiplique por 100',`${nf(d,4)} × 100 = ${nf(t)}%`]])}
  if(k=='desc'||k=='acr'){const d=x*y/100,t=k=='desc'?x-d:x+d,s=k=='desc'?'−':'+';o.innerHTML=result(brl(t),k=='desc'?`Você paga e economiza ${brl(d)}`:'Valor com acréscimo',`valor ${s} (valor × % ÷ 100)`,[[k=='desc'?'Calcule o valor do desconto':'Calcule o valor do acréscimo',`${brl(x)} × ${nf(y)} ÷ 100 = ${brl(d)}`],[k=='desc'?'Subtraia do preço original':'Some ao valor original',`${brl(x)} ${s} ${brl(d)} = ${brl(t)}`]])}
  if(k=='var'){if(!x){o.innerHTML='<div class="msg">O valor inicial não pode ser zero.</div>';return}const df=y-x,d=df/x,t=d*100;o.innerHTML=result(`<span class="${t>0?'up':t<0?'down':''}">${nf(Math.abs(t))}%</span>`,t>0?'Aumento':t<0?'Queda':'Sem variação','((final − inicial) ÷ inicial) × 100',[['Diferença entre os valores',`${nf(y)} − ${nf(x)} = ${nf(df)}`],['Divida pelo valor inicial',`${nf(df)} ÷ ${nf(x)} = ${nf(d,4)}`],['Multiplique por 100',`${nf(d,4)} × 100 = ${nf(t)}%`]])}};
 [m,a,b].forEach(e=>e.oninput=calc);m.onchange=()=>{a.value=b.value='';calc()};calc();
}

/* 2. Contador */
function txtTool(r){
 r.innerHTML=`<label>Cole ou digite seu texto<textarea id="t" placeholder="Seu texto aqui..."></textarea></label><div class="stats" id="s"></div>`;
 const f=()=>{const t=$('#t',r).value,w=(t.trim().match(/\S+/g)||[]).length,p=t.split(/\n+/).filter(x=>x.trim()).length,fr=(t.match(/[^.!?]+[.!?]+/g)||[]).length;
  $('#s',r).innerHTML=[[w,'palavras'],[t.length,'caracteres'],[t.replace(/\s/g,'').length,'sem espaços'],[p,'parágrafos'],[fr,'frases'],[Math.max(w?1:0,Math.ceil(w/200))+' min','de leitura']].map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')};
 $('#t',r).oninput=f;f();
}

/* 3. Senhas */
function pwTool(r){
 r.innerHTML=`<label>Sua senha<input id="pw" readonly></label><div id="fo" class="msg" style="margin:0 0 12px"></div>
 <label>Tamanho: <b id="lv">16</b> caracteres<input type="range" id="len" min="6" max="48" value="16"></label>
 <div class="chk"><label><input type="checkbox" id="u" checked> Maiúsculas</label><label><input type="checkbox" id="l" checked> Minúsculas</label><label><input type="checkbox" id="n" checked> Números</label><label><input type="checkbox" id="y" checked> Símbolos</label></div>
 <button class="p" id="g">Gerar nova senha</button><button class="s" id="c">Copiar</button>`;
 const S={u:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',l:'abcdefghijklmnopqrstuvwxyz',n:'0123456789',y:'!@#$%&*?+-_=.'};
 const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n};
 const gen=()=>{const sets=Object.keys(S).filter(k=>$('#'+k,r).checked),L=+$('#len',r).value;$('#lv',r).textContent=L;
  if(!sets.length){$('#pw',r).value='';$('#fo',r).textContent='Marque pelo menos uma opção.';return}
  const pool=sets.map(k=>S[k]).join('');let p=sets.map(k=>S[k][rnd(S[k].length)]);while(p.length<L)p.push(pool[rnd(pool.length)]);
  for(let i=p.length-1;i>0;i--){const j=rnd(i+1);[p[i],p[j]]=[p[j],p[i]]}p=p.slice(0,L).join('');$('#pw',r).value=p;
  const e=L*Math.log2(pool.length);$('#fo',r).innerHTML='Força: <b class="'+(e<50?'down':e<70?'':'up')+'">'+(e<50?'fraca':e<70?'média':'forte')+'</b>'};
 $('#g',r).onclick=gen;r.querySelectorAll('input[type=checkbox],#len').forEach(e=>e.oninput=gen);
 $('#c',r).onclick=async()=>{const i=$('#pw',r);i.select();try{await navigator.clipboard.writeText(i.value);$('#c',r).textContent='Copiado ✓'}catch(e){$('#c',r).textContent='Selecionada: copie com o menu'}setTimeout(()=>$('#c',r).textContent='Copiar',2200)};gen();
}

/* 4. QR Code */
function qrTool(r){
 r.innerHTML=`<label>Link ou texto<input id="q" placeholder="https://seusite.com" autocomplete="off"></label><div id="qr" style="display:flex;justify-content:center;background:#fff;padding:14px;border-radius:14px;min-height:60px"></div><div class="msg">Para salvar: toque e segure na imagem do QR Code.</div>`;
 const f=()=>{const v=$('#q',r).value.trim(),b=$('#qr',r);b.innerHTML='';if(!v){b.innerHTML='<span style="color:#666;align-self:center">O QR Code aparece aqui</span>';return}
  if(typeof QRCode==='undefined'){b.textContent='Não foi possível carregar o gerador. Verifique a conexão.';return}new QRCode(b,{text:v,width:240,height:240})};
 $('#q',r).oninput=f;f();
}

/* 5. Imagens */
function imgTool(r){
 r.innerHTML=`<label>Escolha uma imagem<input type="file" id="f" accept="image/*"></label><label>Qualidade: <b id="qv">70</b>%<input type="range" id="qs" min="10" max="100" value="70"></label><div id="o"></div>`;
 let file=null;
 const run=()=>{if(!file)return;const q=+$('#qs',r).value;$('#qv',r).textContent=q;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0);
  c.toBlob(bl=>{const u=URL.createObjectURL(bl),s=(1-bl.size/file.size)*100;$('#o',r).innerHTML=`<div class="stats"><div><b>${nf(file.size/1024,0)} KB</b><span>antes</span></div><div><b>${nf(bl.size/1024,0)} KB</b><span>depois</span></div><div><b class="${s>0?'up':'down'}">${nf(s,0)}%</b><span>${s>0?'menor':'maior'}</span></div></div><img class="img" src="${u}" alt="Imagem comprimida"><div class="msg">Para salvar: toque e segure na imagem.</div>`},'image/jpeg',q/100)};im.src=URL.createObjectURL(file)};
 $('#f',r).onchange=e=>{file=e.target.files[0];run()};$('#qs',r).oninput=run;
}

/* 6. Juros */
function jurTool(r){
 r.innerHTML=`<label>Tipo de juros<select id="t"><option value="c">Compostos</option><option value="s">Simples</option></select></label>
 <div class="row"><label>Capital inicial (R$)<input id="c" inputmode="decimal" placeholder="Ex.: 1000"></label><label>Taxa (% ao mês)<input id="i" inputmode="decimal" placeholder="Ex.: 2"></label></div>
 <label>Prazo (meses)<input id="n" inputmode="decimal" placeholder="Ex.: 12"></label><div id="o"></div>`;
 const f=()=>{const C=pn($('#c',r).value),i=pn($('#i',r).value),n=pn($('#n',r).value),o=$('#o',r);
  if([C,i,n].some(isNaN)){o.innerHTML='<div class="msg">Preencha os três campos para ver o resultado.</div>';return}
  if($('#t',r).value=='s'){const J=C*i/100*n;o.innerHTML=result(brl(C+J),`Montante após ${nf(n,0)} meses · juros de ${brl(J)}`,'J = C × i × t  e  M = C + J',[['Calcule os juros',`${brl(C)} × ${nf(i/100,4)} × ${nf(n,0)} = ${brl(J)}`],['Some ao capital',`${brl(C)} + ${brl(J)} = ${brl(C+J)}`]])}
  else{const f=Math.pow(1+i/100,n),M=C*f;o.innerHTML=result(brl(M),`Montante após ${nf(n,0)} meses · juros de ${brl(M-C)}`,'M = C × (1 + i)<sup>t</sup>',[['Taxa em decimal, mais 1',`1 + ${nf(i,2)} ÷ 100 = ${nf(1+i/100,4)}`],['Eleve ao prazo',`${nf(1+i/100,4)}^${nf(n,0)} = ${nf(f,4)}`],['Multiplique pelo capital',`${brl(C)} × ${nf(f,4)} = ${brl(M)}`]])}};
 r.querySelectorAll('input,select').forEach(e=>e.oninput=f);f();
}

/* 7. Currículo */
function curTool(r){
 const F=[['nome','Nome completo'],['cargo','Cargo desejado'],['email','E-mail'],['tel','Telefone']],A=[['resumo','Resumo profissional'],['exp','Experiência (uma por linha)'],['edu','Formação'],['hab','Habilidades']];
 r.innerHTML=`<div class="row">${F.map(f=>`<label>${f[1]}<input id="${f[0]}"></label>`).join('')}</div>${A.map(f=>`<label>${f[1]}<textarea id="${f[0]}" style="min-height:90px"></textarea></label>`).join('')}
 <button class="p" id="p">Imprimir ou salvar PDF</button><div class="paper" id="pp"></div>`;
 const f=()=>{const v=k=>esc($('#'+k,r).value),sec=(t,k)=>v(k)?`<h5>${t}</h5><p>${v(k)}</p>`:'';
  $('#pp',r).innerHTML=`<h4>${v('nome')||'Seu nome'}</h4><p>${v('cargo')}</p><p>${[v('email'),v('tel')].filter(Boolean).join(' | ')}</p>${sec('Resumo','resumo')}${sec('Experiência','exp')}${sec('Formação','edu')}${sec('Habilidades','hab')}`};
 r.querySelectorAll('input,textarea').forEach(e=>e.oninput=f);$('#p',r).onclick=print;f();
}

/* 8. Orçamento */
function orcTool(r){
 let it=[{d:'',q:'1',v:''}];
 r.innerHTML=`<div class="row"><label>Sua empresa<input id="emp"></label><label>Cliente<input id="cli"></label></div><div id="rows"></div>
 <button class="s" id="add">+ Adicionar item</button><button class="p" id="p">Imprimir ou salvar PDF</button><div class="paper" id="pp"></div>`;
 const prev=()=>{const tot=it.reduce((s,x)=>s+(pn(x.q)||0)*(pn(x.v)||0),0);
  $('#pp',r).innerHTML=`<h4>Orçamento</h4><p><b>${esc($('#emp',r).value)}</b></p><p>Cliente: ${esc($('#cli',r).value)||'—'}</p><p>Data: ${new Date().toLocaleDateString('pt-BR')}</p>
  <table><tr><th>Item</th><th class="r">Qtd</th><th class="r">Unit.</th><th class="r">Subtotal</th></tr>${it.filter(x=>x.d||x.v).map(x=>`<tr><td>${esc(x.d)}</td><td class="r">${esc(x.q)}</td><td class="r">${brl(pn(x.v)||0)}</td><td class="r">${brl((pn(x.q)||0)*(pn(x.v)||0))}</td></tr>`).join('')}</table><p class="r" style="text-align:right;font-size:1.2rem;margin-top:10px"><b>Total: ${brl(tot)}</b></p>`};
 const rows=()=>{$('#rows',r).innerHTML=it.map((x,i)=>`<div class="irow"><input data-i="${i}" data-k="d" placeholder="Descrição" value="${esc(x.d)}"><input data-i="${i}" data-k="q" inputmode="decimal" placeholder="Qtd" value="${esc(x.q)}"><input data-i="${i}" data-k="v" inputmode="decimal" placeholder="Valor (R$)" value="${esc(x.v)}"><button class="s" data-del="${i}" aria-label="Remover item">✕</button></div>`).join('');
  r.querySelectorAll('.irow input').forEach(e=>e.oninput=()=>{it[e.dataset.i][e.dataset.k]=e.value;prev()});
  r.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{it.splice(+b.dataset.del,1);if(!it.length)it.push({d:'',q:'1',v:''});rows();prev()})};
 $('#add',r).onclick=()=>{it.push({d:'',q:'1',v:''});rows()};$('#p',r).onclick=print;
 r.querySelectorAll('#emp,#cli').forEach(e=>e.oninput=prev);rows();prev();
}

/* 9. Tradutor */
function trdTool(r){
 const L=[['pt','Português'],['en','Inglês'],['es','Espanhol'],['fr','Francês'],['it','Italiano'],['de','Alemão'],['ja','Japonês'],['zh-CN','Chinês'],['ko','Coreano'],['ru','Russo'],['ar','Árabe']];
 const opts=(sel,auto)=>(auto?'<option value="Autodetect">Detectar idioma</option>':'')+L.map(l=>`<option value="${l[0]}"${l[0]==sel?' selected':''}>${l[1]}</option>`).join('');
 r.innerHTML=`<div class="row" style="align-items:end"><label>De<select id="fr">${opts('Autodetect',1)}</select></label><label>Para<select id="to">${opts('en')}</select></label></div>
 <button class="s" id="sw" style="margin-bottom:12px">⇄ Inverter idiomas</button>
 <label>Texto<textarea id="tx" maxlength="2000" placeholder="Digite ou cole o texto aqui..."></textarea></label><div class="msg" id="ct" style="margin:0 0 12px">0 / 2000</div>
 <button class="p" id="go">Traduzir</button><button class="s" id="cp">Copiar</button><div id="rs" class="steps" style="margin-top:12px;white-space:pre-wrap;min-height:60px" aria-live="polite">A tradução aparece aqui.</div>
 <div class="msg">Precisa de internet. O serviço gratuito tem limite diário de uso.</div>`;
 const fr=$('#fr',r),to=$('#to',r),tx=$('#tx',r),rs=$('#rs',r),go=$('#go',r);
 tx.oninput=()=>{$('#ct',r).textContent=tx.value.length+' / 2000'};
 $('#sw',r).onclick=()=>{const a=fr.value,b=to.value;fr.value=b;to.value=a=='Autodetect'?(b=='pt'?'en':'pt'):a;if(rs.dataset.t){tx.value=rs.dataset.t;tx.oninput()}};
 go.onclick=async()=>{const t=tx.value.trim();if(!t){rs.textContent='Digite um texto para traduzir.';return}
  if(fr.value==to.value){rs.textContent='Escolha dois idiomas diferentes.';return}
  const parts=t.split(/(?<=[.!?\n])/).flatMap(s=>s.match(/[\s\S]{1,450}/g)||[]),ch=[];let c='';
  for(const s of parts){if(c.length+s.length>450){ch.push(c);c=''}c+=s}if(c.trim())ch.push(c);
  go.disabled=true;rs.textContent='Traduzindo...';let out='';
  try{for(const p of ch){const u='https://api.mymemory.translated.net/get?q='+encodeURIComponent(p)+'&langpair='+fr.value+'|'+to.value;
    const d=await (await fetch(u)).json();if(d.responseStatus!=200)throw new Error(d.responseDetails||'erro');out+=d.responseData.translatedText+' '}
   rs.textContent=out.trim();rs.dataset.t=out.trim()}
  catch(e){rs.textContent='Não foi possível traduzir agora. Verifique a internet ou tente de novo mais tarde (o limite diário pode ter acabado).'}
  go.disabled=false};
 $('#cp',r).onclick=async()=>{const b=$('#cp',r);try{await navigator.clipboard.writeText(rs.dataset.t||'');b.textContent='Copiado ✓'}catch(e){b.textContent='Copie pelo menu'}setTimeout(()=>b.textContent='Copiar',2200)};
}

 {id:'contador',cat:'Texto',ic:'📝',nome:'Contador de palavras',desc:'Conte palavras, caracteres e parágrafos.',fn:txtTool},
 {id:'tradutor',cat:'Tradução',ic:'🌍',nome:'Tradutor',desc:'Traduza textos entre 11 idiomas.',fn:trdTool},
 {id:'senhas',cat:'Segurança',ic:'🔐',nome:'Gerador de senhas',desc:'Crie senhas fortes e seguras.',fn:pwTool},
 {id:'qrcode',cat:'Geradores',ic:'📱',nome:'Gerador de QR Code',desc:'Transforme links e textos em QR Codes.',fn:qrTool},
 {id:'imagens',cat:'Imagens',ic:'🖼️',nome:'Compressor de imagens',desc:'Reduza o tamanho das suas imagens.',fn:imgTool},
 {id:'juros',cat:'Calculadoras',ic:'💰',nome:'Calculadora de juros',desc:'Calcule juros simples e compostos.',fn:jurTool},

 {id:'orcamento',cat:'Documentos',ic:'📋',nome:'Gerador de orçamentos',desc:'Crie orçamentos de forma simples.',fn:orcTool}
];
let cat='Todas';
function home(){const cats=['Todas',...new Set(T.map(t=>t.cat))];
 $('#chips').innerHTML=cats.map(c=>`<button class="chip${c==cat?' on':''}" data-c="${c}">${c}</button>`).join('');
 $('#grid').innerHTML=T.filter(t=>cat=='Todas'||t.cat==cat).map(t=>`<button class="tc" data-id="${t.id}"><span class="ic">${t.ic}</span><small>${t.cat}</small><b>${t.nome}</b><span>${t.desc}</span><small>Abrir ferramenta →</small></button>`).join('');
 $('#chips').onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;home()}};
 $('#grid').onclick=e=>{const b=e.target.closest('[data-id]');if(b)location.hash=b.dataset.id}}
function route(){const t=T.find(x=>x.id==location.hash.slice(1));$('#home').hidden=!!t;$('#tool').hidden=!t;
 if(t){$('#tt').textContent=t.nome;$('#td').textContent=t.desc;$('#tb').innerHTML='';t.fn($('#tb'));scrollTo(0,0)}}
$('#back').onclick=()=>{location.hash=''};
addEventListener('hashchange',route);home();route();
</script>
